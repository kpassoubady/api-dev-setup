$kind: http-request
url: "{{baseUrl}}/api/v1/greetings/Learner"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Message contains name', function () {
          const body = pm.response.json();
          pm.expect(body.message).to.include('Learner');
      });
    language: text/javascript
order: 2000
